services:
  sea-router:
    image: ghcr.io/auto-sea-way/asw:0.10.0-full
    environment:
      ASW_API_KEY: ${ASW_API_KEY:-local-development-change-me}
    expose:
      - "3000"
    restart: unless-stopped

  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 4000
      SEA_ROUTER_URL: http://sea-router:3000
      SEA_ROUTER_KEY: ${ASW_API_KEY:-local-development-change-me}
      SEA_RATE_LIMIT_PER_MINUTE: 20
      SEA_ROUTER_TIMEOUT_MS: 90000
    ports:
      - "4000:4000"
    depends_on:
      - sea-router
    restart: unless-stopped
